name: ColemakTrainer
options:
  bundleIdPrefix: com.niccho
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"

targets:
  ColemakTrainer:
    type: application
    platform: macOS
    sources:
      - ColemakTrainer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.niccho.ColemakTrainer
        PRODUCT_NAME: ColemakTrainer
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        INFOPLIST_GENERATION_MODE: GeneratedFile
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: ColemakTrainer/ColemakTrainer.entitlements
